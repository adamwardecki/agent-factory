name: factory-router

# Generated by agent-factory (scripts/render-callers.ts). Don't edit by hand: render it again for a new pin.

on:
  issues: { types: [labeled] }
  issue_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  pull_request_target: { types: [closed] }
  schedule:
    - cron: '${sweep_cron}'
  workflow_dispatch:
    inputs:
      report_stage: { type: string, required: false }
      report_issue: { type: string, required: false }
      report_attempt: { type: string, required: false }
      report_run_id: { type: string, required: false }
      report_result: { type: string, required: false }

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  route:
    uses: ${factory_repo}/.github/workflows/router.yml@${factory_ref}
    with:
      interface: 1
      dry_run: $${{ vars.FACTORY_DRY_RUN }}
      paused: $${{ vars.FACTORY_PAUSED }}
    secrets:
      FACTORY_SIGNING_KEY: $${{ secrets.FACTORY_SIGNING_KEY }}
