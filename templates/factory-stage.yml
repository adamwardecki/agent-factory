name: factory-stage
run-name: 'factory-$${{ inputs.stage }} #$${{ inputs.issue }} $${{ inputs.attempt }}'

# Generated by agent-factory (scripts/render-callers.ts). Don't edit by hand: render it again for a new pin.
# The router dispatches this. A run started by hand does nothing unless its attempt is the issue's current one.

on:
  workflow_dispatch:
    inputs:
      stage: { type: choice, options: [plan, build, verify, review, fix], required: true }
      issue: { type: string, required: true }
      attempt: { type: string, required: true }

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  stage:
    if: inputs.stage != 'verify'
    concurrency: { group: 'factory-stage-$${{ inputs.issue }}', cancel-in-progress: false }
    uses: ${factory_repo}/.github/workflows/stage.yml@${factory_ref}
    with:
      interface: 1
      stage: $${{ inputs.stage }}
      issue: $${{ inputs.issue }}
      attempt: $${{ inputs.attempt }}
      paused: $${{ vars.FACTORY_PAUSED }}
    secrets:
      FACTORY_SIGNING_KEY: $${{ secrets.FACTORY_SIGNING_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: $${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  verify:
    if: inputs.stage == 'verify'
    concurrency: { group: 'factory-stage-$${{ inputs.issue }}', cancel-in-progress: false }
    uses: ${factory_repo}/.github/workflows/verify.yml@${factory_ref}
    with:
      interface: 1
      issue: $${{ inputs.issue }}
      attempt: $${{ inputs.attempt }}
    secrets:
      FACTORY_SIGNING_KEY: $${{ secrets.FACTORY_SIGNING_KEY }}
