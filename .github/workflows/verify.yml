name: factory verify

# The factory's own restricted CI, called by the target repo's factory-stage.yml when the stage is verify. It runs
# the repo's configured commands on the PR head the diff gate checked, and nothing else of the repo's. The verify job
# has a read-only token, no secrets and no caches, and runs every command through scripts/sandboxed.sh. The repo's
# own CI, which may hold secrets, is not started here: it waits for a maintainer on the PR.
# Caller interface 1.

on:
  workflow_call:
    inputs:
      interface: { type: number, required: true }
      issue: { type: string, required: true }
      attempt: { type: string, required: true }
    secrets:
      FACTORY_SIGNING_KEY: { required: true }

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, issues: read, pull-requests: read, actions: read }
    outputs:
      attempt: ${{ steps.prep.outputs.attempt }}
      gated-sha: ${{ steps.prep.outputs.gated-sha }}
      node: ${{ steps.prep.outputs.node }}
      python: ${{ steps.prep.outputs.python }}
      install: ${{ steps.prep.outputs.install }}
      typecheck: ${{ steps.prep.outputs.typecheck }}
      lint: ${{ steps.prep.outputs.lint }}
      test: ${{ steps.prep.outputs.test }}
    steps:
      - name: Check the caller interface
        env: { INTERFACE: '${{ inputs.interface }}' }
        run: '[[ "$INTERFACE" == "1" ]] || { echo "::error::This agent-factory release speaks caller interface 1, not $INTERFACE. Re-render the caller workflows for the release you pin."; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: '${{ job.workflow_repository }}', ref: '${{ job.workflow_sha }}', path: .factory-src, persist-credentials: false }
      - id: prep
        uses: ./.factory-src/actions/prepare
        with:
          stage: verify
          issue: ${{ inputs.issue }}
          attempt: ${{ inputs.attempt }}
          signing-key: ${{ secrets.FACTORY_SIGNING_KEY }}
          auth-mode: oauth_token

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      # The factory's script goes to the runner's temp directory, which the sandbox hides: the branch's code can
      # neither read it nor replace it between two commands.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: '${{ job.workflow_repository }}', ref: '${{ job.workflow_sha }}', path: .factory-src, persist-credentials: false }
      - run: mv .factory-src "$RUNNER_TEMP/factory-src"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.prepare.outputs.gated-sha }}', persist-credentials: false }
      - if: needs.prepare.outputs.node != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.prepare.outputs.node }}
      - if: needs.prepare.outputs.python != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.prepare.outputs.python }}
      # The hosted image ships bubblewrap. apt is the fallback for one that doesn't, and never starts with
      # `apt-get update`: on the 26.04 image it hung for minutes on mirror DNS failures (phase 0, check 3).
      - name: Install the sandbox
        timeout-minutes: 5
        run: |
          command -v bwrap >/dev/null || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Install
        if: needs.prepare.outputs.install != ''
        env: { CMD: '${{ needs.prepare.outputs.install }}' }
        run: '"$RUNNER_TEMP/factory-src/scripts/sandboxed.sh" "$CMD"'
      - name: Typecheck
        if: needs.prepare.outputs.typecheck != ''
        env: { CMD: '${{ needs.prepare.outputs.typecheck }}' }
        run: '"$RUNNER_TEMP/factory-src/scripts/sandboxed.sh" "$CMD"'
      - name: Lint
        if: needs.prepare.outputs.lint != ''
        env: { CMD: '${{ needs.prepare.outputs.lint }}' }
        run: '"$RUNNER_TEMP/factory-src/scripts/sandboxed.sh" "$CMD"'
      - name: Test
        env: { CMD: '${{ needs.prepare.outputs.test }}' }
        run: '"$RUNNER_TEMP/factory-src/scripts/sandboxed.sh" "$CMD"'

  report:
    needs: [prepare, verify]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          RESULT: ${{ needs.verify.result == 'success' && 'success' || 'failure' }}
        run: gh workflow run factory-router.yml -R "$GITHUB_REPOSITORY" -f report_stage=verify -f report_issue="$ISSUE" -f report_attempt="$ATTEMPT" -f report_run_id="$GITHUB_RUN_ID" -f report_result="$RESULT"
